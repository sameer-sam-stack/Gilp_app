name: Build and Release Glip APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Prepare HAZE APK for Direct Download
        run: |
          APK_PATH=$(find app/build -type f -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" HAZE.apk
          ls -lh HAZE.apk

      - name: Publish Direct APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "HAZE Latest Release (v1.0.1)"
          files: HAZE.apk
